apiVersion: apps/v1
kind: Deployment
metadata:
  name: xyliganimbot
  namespace: xyliganimbot
  labels:
    app: xyliganimbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xyliganimbot
  template:
    metadata:
      labels:
        app: xyliganimbot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: xyliganimbot
        image: xyliganimbot:latest
        imagePullPolicy: IfNotPresent  # Используем локальный образ, если он есть
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        envFrom:
        - secretRef:
            name: xyliganimbot-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "1"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        - name: logs-volume
          mountPath: /app/logs
        - name: models-volume
          mountPath: /app/models
        - name: config-volume
          mountPath: /app/config.yaml
          subPath: config.yaml
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: xyliganimbot-data-pvc
      - name: logs-volume
        persistentVolumeClaim:
          claimName: xyliganimbot-logs-pvc
      - name: models-volume
        persistentVolumeClaim:
          claimName: xyliganimbot-models-pvc
      - name: config-volume
        configMap:
          name: xyliganimbot-config
